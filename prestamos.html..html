ing:5px 9px;font-size:11px}@media(max-width:950px){.grid2{grid-template-columns:1fr}}body.dark{--bg:#0b1422;--ink:#e6edf6;--muted:#93a3b8;--line:#22344d}body.dark .card,body.dark .panel,body.dark .modalbox{background:#122338}body.dark .field input,body.dark .field select,body.dark .field textarea,body.dark .search{background:#0b1422;color:var(--ink);border-color:#2b4060}body.dark th{background:#0f1f35}body.dark .soft{background:#1c3250;color:#e6edf6}body.dark .notice{background:#2b2410;color:#f1d99b;border-color:#6b5a22}body.dark .contract{color:#e6edf6}body.dark .pill{background:#1c3250}@media print{body.dark .modalbox{background:#fff}body.dark .contract{color:#111}}.footer-note{font-size:11px;color:var(--muted);margin-top:18px}.pill{border-radius:999px;padding:6px 10px;background:#e8eef6}.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpis .pill{font-size:12px}@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{padding:12px}.brand{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top h1{font-size:21px}.signature{gap:20px}}

const CLOUD=!SB_URL.includes('PEGA');const KEY='finwise-loans-v2';let db=CLOUD?blank():load();let page='dashboard';let selectedLoan='';
function blank(){return {settings:{company:'FinWise',ruc:'',representative:'',address:'',phone:'',dailyLateFee:10,lateFeeGrace:0,currency:'S/'},clients:[],loans:[],payments:[],collectors:[],audit:[]}}
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}function save(){if(CLOUD)cloudPush();else localStorage.setItem(KEY,JSON.stringify(db));render()}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PE'):'—';const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};const plusMonths=(d,n)=>{let x=new Date(d+'T12:00:00'),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toISOString().slice(0,10)};
function client(id){return db.clients.find(c=>c.id===id)||{name:'Cliente eliminado'}}function loan(id){return db.loans.find(l=>l.id===id)}function log(msg){db.audit.unshift({at:new Date().toISOString(),msg});db.audit=db.audit.slice(0,300)}function paidTotal(lid){return db.payments.filter(p=>p.loanId===lid&&p.kind==='installment').reduce((s,p)=>s+Number(p.amount),0)}function moraPaid(lid){return db.payments.filter(p=>p.loanId===lid&&p.kind==='mora').reduce((s,p)=>s+Number(p.amount),0)}
function schedule0(l){let rows=[],start=l.firstDue||l.startDate;for(let i=1;i<=Number(l.installments);i++){let due;if(l.frequency==='Diario')due=addDays(start,i-1);else if(l.frequency==='Semanal')due=addDays(start,(i-1)*7);else if(l.frequency==='Quincenal')due=addDays(start,(i-1)*15);else due=plusMonths(start,i-1);rows.push({n:i,due,amount:round(Number(l.total)/Number(l.installments))})}let sum=rows.reduce((s,r)=>s+r.amount,0);if(rows.length)rows[rows.length-1].amount=round(rows[rows.length-1].amount+(Number(l.total)-sum));return rows}function round(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function installmentStatus(l,row){let amount=db.payments.filter(p=>p.loanId===l.id&&p.kind==='installment'&&Number(p.installment)===row.n).reduce((s,p)=>s+Number(p.amount),0);let bal=Math.max(0,round(row.amount-amount));let days=Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(row.due+'T12:00:00'))/86400000));let late=bal>0&&days>Number(db.settings.lateFeeGrace||0)?Math.max(0,days-Number(db.settings.lateFeeGrace||0))*Number(db.settings.dailyLateFee||0):0;return {paid:amount,balance:bal,days,late}}
function loanOutstanding(l){return Math.max(0,round(Number(l.total)-paidTotal(l.id)))}function dueMora(l){return Math.max(0,round(schedule(l).reduce((s,r)=>s+installmentStatus(l,r).late,0)-moraPaid(l.id)))}function personOptions(){return db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}${c.doc?' · '+esc(c.doc):''}</option>`).join('')}function collectorOptions(){return ['<option value="">Sin asignar</option>',...db.collectors.map(c=>`<option>${esc(c)}</option>`)].join('')}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('today').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function render(){const titles={dashboard:'Resumen',clients:'Clientes',loans:'Préstamos',payments:'Registrar pagos',portfolio:'Cartera y mora',collection:'Cobranza del día',admin:'Panel del administrador',contracts:'Contratos y cronogramas',reports:'Reportes',settings:'Configuración',cancelled:'Préstamos anulados'};$('pageTitle').textContent=titles[page]||'FinWise';const fn={dashboard:dashboard,clients:clientsPage,loans:loansPage,payments:paymentsPage,portfolio:portfolioPage,collection:collectionPage,admin:adminPage,contracts:contractsPage,reports:reportsPage,settings:settingsPage,cancelled:cancelledPage};$('app').innerHTML=fn[page]();}
function dashboard(){let active=db.loans.filter(l=>!l.cancelled),capital=active.reduce((s,l)=>s+Number(l.capital),0),out=active.reduce((s,l)=>s+loanOutstanding(l),0),late=active.reduce((s,l)=>s+dueMora(l),0),todayDue=active.reduce((s,l)=>s+schedule(l).filter(r=>r.due===today()).reduce((ss,r)=>ss+installmentStatus(l,r).balance,0),0);return `<div class="cards"><div class="card"><div class="metric-label">Clientes registrados</div><div class="metric">${db.clients.length}</div></div><div class="card"><div class="metric-label">Préstamos activos</div><div class="metric">${active.length}</div></div><div class="card"><div class="metric-label">Saldo por cobrar</div><div class="metric">${money(out)}</div></div><div class="card"><div class="metric-label">Mora estimada pendiente</div><div class="metric">${money(late)}</div></div></div><div class="notice"><b>Control diario:</b> cuota con vencimiento hoy: ${money(todayDue)}. La mora mostrada es un cálculo orientativo según los días de atraso y la tarifa configurada; verifica que sea legal y esté pactada con el cliente.</div><div class="panel"><div class="row"><h2>Actividad reciente</h2><button class="primary fit" onclick="go('loans')">+ Nuevo préstamo</button><button class="soft fit" onclick="go('clients')">+ Nuevo cliente</button></div>${db.audit.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Movimiento</th></tr></thead><tbody>${db.audit.slice(0,8).map(a=>`<tr><td>${new Date(a.at).toLocaleString('es-PE')}</td><td>${esc(a.msg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay movimientos. Registra tu primer cliente o préstamo.</div>'}</div><div class="panel"><h2>Recomendaciones para operar</h2><ul><li>Configura razón social, RUC y datos del prestamista.</li><li>Registra primero a cada cliente y luego crea su préstamo.</li><li>Registra pagos indicando la cuota correspondiente para mantener el cronograma exacto.</li><li>Descarga una copia de seguridad al terminar cada jornada.</li></ul></div>`}
function clientsPage(){return `<div class="panel"><h2>Registrar cliente</h2><form onsubmit="addClient(event)"><div class="formgrid"><div class="field"><label>Nombre completo / razón social *</label><input id="cname" required></div><div class="field"><label>DNI / RUC</label><input id="cdoc" maxlength="11"></div><div class="field"><label>Teléfono</label><input id="cphone" inputmode="tel"></div><div class="field"><label>Dirección</label><input id="caddress"></div><div class="field"><label>Correo (opcional)</label><input id="cemail" type="email"></div><div class="field"><label>Notas internas</label><input id="cnote"></div></div><div class="actions"><button class="primary">Guardar cliente</button></div></form></div><div class="panel"><div class="row"><h2>Directorio de clientes (${db.clients.length})</h2><input class="search" placeholder="Buscar nombre, documento o teléfono" oninput="filterTable(this,'clientTable')"></div><div class="tablewrap"><table id="clientTable"><thead><tr><th>Cliente</th><th>Documento</th><th>Teléfono</th><th>Préstamos</th><th>Acciones</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td>${esc(c.name)} ${riskTag(c.id)}<div class="muted">${esc(c.address||'')}</div></td><td>${esc(c.doc||'—')}</td><td>${esc(c.phone||'—')}</td><td>${db.loans.filter(l=>l.clientId===c.id&&!l.cancelled).length}</td><td><button class="soft" onclick="clientDetail('${c.id}')">Ver</button> <button class="soft" onclick="editClient('${c.id}')">Editar</button> ${c.phone?`<button class="gold" onclick="window.open(waLink('${esc(c.phone)}','Hola, le saludamos de '+db.settings.company),'_blank')">WhatsApp</button>`:''} <button class="danger" onclick="deleteClient('${c.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin clientes registrados.</td></tr>'}</tbody></table></div></div>`}
function addClient(e){e.preventDefault();let c={id:uid(),name:$('cname').value.trim(),doc:$('cdoc').value.trim(),phone:$('cphone').value.trim(),address:$('caddress').value.trim(),email:$('cemail').value.trim(),note:$('cnote').value.trim(),created:today()};db.clients.push(c);log('Cliente registrado: '+c.name);save()}
function deleteClient(id){if(db.loans.some(l=>l.clientId===id&&!l.cancelled)){alert('Este cliente tiene préstamos activos. No se puede eliminar; conserva el historial.');return}if(confirm('¿Eliminar este cliente?')){db.clients=db.clients.filter(c=>c.id!==id);save()}}function clientDetail(id){let c=client(id),ls=db.loans.filter(l=>l.clientId===id);openModal('Ficha del cliente',`<div class="contract"><h2>${esc(c.name)}</h2><p>Documento: ${esc(c.doc||'—')} · Teléfono: ${esc(c.phone||'—')}</p><p>Dirección: ${esc(c.address||'—')} · Correo: ${esc(c.email||'—')}</p><p>Notas: ${esc(c.note||'—')}</p><h3>Préstamos relacionados</h3>${ls.length?ls.map(l=>`<p>${esc(l.code)} — Capital ${money(l.capital)} — Total ${money(l.total)} — ${l.cancelled?'ANULADO':'Activo'}</p>`).join(''):'Sin préstamos'}</div>`)}
function loansPage(){return `<div class="panel"><h2>Crear préstamo</h2>${db.clients.length?'':`<div class="notice">Primero registra al menos un cliente.</div>`}<form onsubmit="addLoan(event)"><div class="formgrid"><div class="field"><label>Cliente *</label><select id="lclient" required>${personOptions()}</select></div><div class="field"><label>Capital entregado (S/) *</label><input id="lcapital" type="number" min="0.01" step="0.01" required oninput="calcLoanPreview()"></div><div class="field"><label>Forma de calcular total *</label><select id="lmode" onchange="toggleLoanMode();calcLoanPreview()"><option value="percent">Capital + interés (%)</option><option value="manual">Monto total pactado</option></select></div><div class="field" id="rateField"><label>Interés total (%)</label><input id="lrate" type="number" min="0" step="0.01" value="20" oninput="calcLoanPreview()"></div><div class="field hidden" id="totalField"><label>Total a devolver (S/)</label><input id="lmanual" type="number" min="0.01" step="0.01" oninput="calcLoanPreview()"></div><div class="field"><label>Frecuencia *</label><select id="lfrequency"><option>Diario</option><option selected>Semanal</option><option>Quincenal</option><option>Mensual</option></select></div><div class="field"><label>Número de cuotas *</label><input id="linst" type="number" min="1" max="500" value="4" required oninput="calcLoanPreview()"></div><div class="field"><label>Fecha de entrega *</label><input id="lstart" type="date" value="${today()}" required></div><div class="field"><label>Primera cuota vence *</label><input id="ldue" type="date" value="${addDays(today(),7)}" required></div><div class="field"><label>Cobrador asignado</label><select id="lcollector">${collectorOptions()}</select></div><div class="field"><label>Forma de firma</label><select id="lsign"><option>Manual (impresa)</option><option>Firma electrónica externa</option></select></div><div class="field"><label>Referencia / motivo</label><input id="lreason" placeholder="Opcional"></div></div><div class="notice" id="loanPreview">Total y cuota estimada aparecerán aquí.</div><div class="actions"><button class="primary" ${db.clients.length?'':'disabled'}>Crear préstamo y cronograma</button></div></form></div><div class="panel"><div class="row"><h2>Préstamos registrados</h2><input class="search" placeholder="Buscar código, cliente o estado (Vencido, Activo, Pagado)" oninput="filterTable(this,'loanTable')"></div><div class="tablewrap"><table id="loanTable"><thead><tr><th>Código</th><th>Cliente</th><th>Capital</th><th>Total pactado</th><th>Pagado</th><th>Saldo</th><th>Frecuencia</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.loans.filter(l=>!l.cancelled).map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(client(l.clientId).name)}</td><td>${money(l.capital)}</td><td>${money(l.total)}</td><td>${money(paidTotal(l.id))}<div class="bar"><i style="width:${pct(l)}%"></i></div></td><td>${money(loanOutstanding(l))}</td><td>${l.frequency}</td><td>${statusTag(l)}</td><td><button class="soft" onclick="loanDetail('${l.id}')">Detalle</button> <button class="soft" onclick="openContract('${l.id}')">Contrato</button> <button class="danger" onclick="cancelLoan('${l.id}')">Anular</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No hay préstamos activos.</td></tr>'}</tbody></table></div></div>`}
function toggleLoanMode(){let manual=$('lmode').value==='manual';$('rateField').classList.toggle('hidden',manual);$('totalField').classList.toggle('hidden',!manual)}function calcLoanPreview(){if(!$('lcapital'))return;let cap=+$('lcapital').value||0,total=$('lmode').value==='manual'?(+$('lmanual').value||0):cap*(1+(+$('lrate').value||0)/100),n=Math.max(1,+$('linst').value||1);$('loanPreview').innerHTML=`Capital: <b>${money(cap)}</b> · Total a devolver: <b>${money(total)}</b> · Cuota aproximada: <b>${money(total/n)}</b> · Interés total: <b>${money(total-cap)}</b>`}
function addLoan(e){e.preventDefault();let cap=+$('lcapital').value,mode=$('lmode').value,total=mode==='manual'?+$('lmanual').value:cap*(1+(+$('lrate').value||0)/100),n=+$('linst').value;if(!db.clients.length||cap<=0||total<cap||n<1){alert('Revisa el cliente, capital, total y cuotas. El total no puede ser menor al capital.');return}let l={id:uid(),code:'FW-'+new Date().getFullYear()+'-'+String(db.loans.length+1).padStart(4,'0'),clientId:$('lclient').value,capital:round(cap),mode,rate:mode==='percent'?+$('lrate').value: null,total:round(total),frequency:$('lfrequency').value,installments:n,startDate:$('lstart').value,firstDue:$('ldue').value,collector:$('lcollector').value,signMethod:$('lsign').value,reason:$('lreason').value.trim(),cancelled:false,created:today()};db.loans.unshift(l);log('Préstamo '+l.code+' creado para '+client(l.clientId).name);save();setTimeout(()=>loanDetail(l.id),100)}
function loanDetail0(id){let l=loan(id);if(!l)return;let rows=schedule(l).map(r=>{let st=installmentStatus(l,r);return `<tr><td>${r.n}</td><td>${fmt(r.due)}</td><td>${money(r.amount)}</td><td>${money(st.paid)}</td><td>${money(st.balance)}</td><td>${st.days?st.days+' días':'—'}</td><td>${money(st.late)}</td><td><button class="soft" onclick="quickPayment('${l.id}',${r.n})">Registrar pago</button></td></tr>`}).join('');openModal('Detalle '+l.code,`<div class="kpis"><span class="pill">Cliente: <b>${esc(client(l.clientId).name)}</b></span><span class="pill">Capital: <b>${money(l.capital)}</b></span><span class="pill">Total: <b>${money(l.total)}</b></span><span class="pill">Saldo: <b>${money(loanOutstanding(l))}</b></span><span class="pill">Mora estimada: <b>${money(dueMora(l))}</b></span></div><div class="actions no-print"><button class="primary" onclick="quickPayment('${l.id}', '')">+ Registrar pago</button><button class="soft" onclick="openContract('${l.id}')">Ver contrato</button><button class="soft" onclick="downloadLoanCSV('${l.id}')">Descargar cronograma CSV</button></div><div class="tablewrap"><table><thead><tr><th>Cuota</th><th>Vencimiento</th><th>Importe</th><th>Pagado</th><th>Saldo cuota</th><th>Atraso</th><th>Mora estimada</th><th>Acción</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small muted">La mora se calcula por cuota pendiente desde su vencimiento, menos los días de gracia configurados. Si la cuota se paga parcialmente, el sistema no prorratea días históricos: revisa el cálculo antes de cobrar.</p>`)}
function cancelLoan(id){let l=loan(id);if(!l)return;let reason=prompt('Motivo de anulación. Se conservará el historial de pagos:');if(reason===null)return;if(!reason.trim()){alert('Indica el motivo para dejar constancia.');return}l.cancelled=true;l.cancelReason=reason.trim();l.cancelledAt=today();log('Préstamo '+l.code+' anulado: '+reason);save()}
function paymentsPage(){return `<div class="panel"><h2>Registrar pago manual</h2><form onsubmit="addPayment(event)"><div class="formgrid"><div class="field"><label>Préstamo *</label><select id="ppLoan" required onchange="populateInstallments()">${db.loans.filter(l=>!l.cancelled).map(l=>`<option value="${l.id}">${esc(l.code)} · ${esc(client(l.clientId).name)} · saldo ${money(loanOutstanding(l))}</option>`).join('')}</select></div><div class="field"><label>Tipo de pago *</label><select id="pkind" onchange="populateInstallments()"><option value="installment">Pago de cuota / abono</option><option value="mora">Pago de mora</option></select></div><div class="field"><label>Cuota relacionada</label><select id="pinst"><option value="">Automático (cuotas más antiguas)</option></select></div><div class="field"><label>Importe recibido (S/) *</label><input id="pamount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Fecha de pago *</label><input id="pdate" type="date" value="${today()}" required></div><div class="field"><label>Medio de pago</label><select id="pmethod"><option>Efectivo</option><option>Yape / Plin</option><option>Transferencia bancaria</option><option>Otro</option></select></div><div class="field full"><label>Observación / operación</label><input id="pnote" placeholder="Número de operación o detalle"></div></div><div class="actions"><button class="primary">Guardar pago</button></div></form></div><div class="panel"><h2>Historial de pagos</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Préstamo</th><th>Tipo</th><th>Cuota</th><th>Importe</th><th>Medio</th><th>Observación</th><th></th></tr></thead><tbody>${db.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let l=loan(p.loanId);return `<tr><td>${fmt(p.date)}</td><td>${esc(l?client(l.clientId).name:'Préstamo anulado')}</td><td>${esc(l?.code||'—')}</td><td>${p.kind==='mora'?'Mora':'Cuota / abono'}</td><td>${p.installment||'—'}</td><td>${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.note||'')}</td><td><button class="soft" onclick="receipt('${p.id}')">Recibo</button> <button class="danger" onclick="voidPayment('${p.id}')">Anular</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Aún no se registran pagos.</td></tr>'}</tbody></table></div></div>`}
function populateInstallments(){let sel=$('pinst'),l=loan($('ppLoan')?.value);if(!sel||!l)return;let kind=$('pkind').value;sel.innerHTML='<option value="">Automático (cuotas más antiguas)</option>'+schedule(l).map(r=>`<option value="${r.n}">Cuota ${r.n} · ${fmt(r.due)} · ${money(kind==='mora'?installmentStatus(l,r).late:installmentStatus(l,r).balance)}</option>`).join('')}
function addPayment(e){e.preventDefault();let l=loan($('ppLoan').value),kind=$('pkind').value,inst=+$('pinst').value,amount=+$('pamount').value;if(!l||amount<=0){alert('Selecciona préstamo e importe válido.');return}if(!inst){alert('Selecciona la cuota a la que se aplicará el pago para que el cronograma se actualice correctamente.');return}if(kind==='installment'&&amount>loanOutstanding(l)+0.01&&!confirm('El importe supera el saldo del préstamo. ¿Registrar de todos modos?'))return;let p={id:uid(),loanId:l.id,kind,installment:inst,amount:round(amount),date:$('pdate').value,method:$('pmethod').value,note:$('pnote').value.trim(),created:new Date().toISOString()};db.payments.push(p);log('Pago '+money(amount)+' registrado en '+l.code+' ('+(kind==='mora'?'mora':'cuota '+inst)+')');save()}
function quickPayment(lid,inst){selectedLoan=lid;go('payments');setTimeout(()=>{if($('ppLoan')){$('ppLoan').value=lid;populateInstallments();if(inst)$('pinst').value=inst;$('pamount').focus();window.scrollTo({top:0,behavior:'smooth'})}},50)}
function portfolioPage(){let active=db.loans.filter(l=>!l.cancelled),rows=active.map(l=>{let due=schedule(l).filter(r=>installmentStatus(l,r).balance>0&&r.due<today()),m=dueMora(l);return `<tr><td>${esc(l.code)}</td><td>${esc(client(l.clientId).name)}</td><td>${esc(l.collector||'Sin asignar')}</td><td>${due.length}</td><td>${money(loanOutstanding(l))}</td><td>${money(m)}</td><td><button class="soft" onclick="loanDetail('${l.id}')">Ver</button> <button class="soft" onclick="assignCollector('${l.id}')">Asignar</button></td></tr>`}).join('');return `<div class="panel"><h2>Cartera y cuotas atrasadas</h2><div class="notice">La mora es estimada: tarifa actual <b>${money(db.settings.dailyLateFee)} por día</b>; días de gracia: ${Number(db.settings.lateFeeGrace||0)}. Asegúrate de que las condiciones sean transparentes, pactadas y compatibles con la normativa aplicable.</div><div class="tablewrap"><table><thead><tr><th>Préstamo</th><th>Cliente</th><th>Cobrador</th><th>Cuotas vencidas</th><th>Saldo</th><th>Mora estimada</th><th>Acciones</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No hay préstamos activos.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Administrar cobradores</h2><form class="row" onsubmit="addCollector(event)"><div class="field"><label>Nombre del cobrador</label><input id="collectorName" placeholder="Nombre completo" required></div><button class="primary fit">Agregar cobrador</button></form><div class="actions">${db.collectors.map(c=>`<span class="pill">${esc(c)} <button class="danger" onclick="removeCollector('${esc(c)}')">×</button></span>`).join('')||'<span class="muted">No hay cobradores registrados.</span>'}</div></div>`}
function addCollector(e){e.preventDefault();let n=$('collectorName').value.trim();if(n&&!db.collectors.includes(n)){db.collectors.push(n);log('Cobrador agregado: '+n);save()}}function removeCollector(n){if(confirm('¿Quitar este cobrador de las opciones? Los préstamos ya asignados conservarán el nombre.')){db.collectors=db.collectors.filter(c=>c!==n);save()}}function assignCollector(id){let l=loan(id),opts=['',...db.collectors].map(c=>`${c===l.collector?'*':''}${c}`).join('\n');let n=prompt('Escribe el nombre exacto del cobrador, o deja vacío para desasignar. Opciones:\n'+opts,l.collector||'');if(n===null)return;if(n&&!db.collectors.includes(n)){alert('Primero agrega ese cobrador en el módulo de cartera.');return}l.collector=n;log('Cartera '+l.code+' asignada a '+(n||'sin asignar'));save()}
function contractsPage(){return `<div class="panel"><h2>Contratos y cronogramas</h2><p>Selecciona un préstamo para generar el contrato individual con sus condiciones, datos del prestamista y cronograma anexo. Puedes imprimirlo o guardarlo como PDF desde el navegador.</p><div class="tablewrap"><table><thead><tr><th>Préstamo</th><th>Cliente</th><th>Firma prevista</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${db.loans.filter(l=>!l.cancelled).map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(client(l.clientId).name)}</td><td>${esc(l.signMethod)}</td><td>${money(l.total)}</td><td><button class="primary" onclick="openContract('${l.id}')">Generar contrato</button> <button class="soft" onclick="loanDetail('${l.id}')">Cronograma</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Registra un préstamo para generar su contrato.</td></tr>'}</tbody></table></div><div class="notice">La opción “Firma electrónica externa” solo identifica el flujo deseado; esta app no firma electrónicamente ni verifica identidad. Para una firma electrónica real, usa un proveedor especializado y archiva la evidencia de consentimiento.</div></div>`}
function openContract(id){let l=loan(id),c=client(l.clientId),s=db.settings;let rows=schedule(l).map(r=>`<tr><td>${r.n}</td><td>${fmt(r.due)}</td><td>${money(r.amount)}</td></tr>`).join('');let text=`<div class="contract"><h2>CONTRATO DE PRÉSTAMO DE DINERO</h2><p><b>Código:</b> ${esc(l.code)} · <b>Fecha:</b> ${fmt(l.startDate)}</p><p>Conste por el presente documento privado el contrato que celebran, de una parte, <b>${esc(s.company||'________________')}</b>, RUC <b>${esc(s.ruc||'________________')}</b>, con domicilio en <b>${esc(s.address||'________________')}</b>, representada por <b>${esc(s.representative||'________________')}</b>, a quien en adelante se denominará EL PRESTAMISTA; y de la otra parte <b>${esc(c.name)}</b>, identificado(a) con DNI/RUC N.º <b>${esc(c.doc||'________________')}</b>, con domicilio en <b>${esc(c.address||'________________')}</b>, a quien se denominará EL PRESTATARIO; bajo las cláusulas siguientes:</p><h3>PRIMERA: OBJETO Y ENTREGA</h3><p>EL PRESTAMISTA entrega en calidad de préstamo la suma de <b>${money(l.capital)}</b> (capital), cuya recepción deberá quedar acreditada por el medio de entrega correspondiente. La fecha de entrega declarada es ${fmt(l.startDate)}.</p><h3>SEGUNDA: MONTO TOTAL Y FORMA DE PAGO</h3><p>Las partes declaran que el monto total pactado a devolver es <b>${money(l.total)}</b>, compuesto por capital de ${money(l.capital)} e interés total pactado de ${money(l.total-l.capital)} (${l.mode==='percent'?esc(l.rate)+'%':'monto fijo acordado'}). El pago se realizará en ${l.installments} cuotas con frecuencia ${esc(l.frequency.toLowerCase())}, conforme al cronograma adjunto, que forma parte integrante del contrato.</p><h3>TERCERA: PAGOS Y CONSTANCIAS</h3><p>Los pagos se registrarán con fecha, importe y medio de pago, entregándose o conservándose la constancia correspondiente. Los pagos parciales deberán imputarse al concepto y cuota que acuerden las partes y registrarse de forma clara. EL PRESTAMISTA mantendrá un registro actualizado del saldo.</p><h3>CUARTA: ATRASOS Y CARGOS</h3><p>Si existe atraso, se aplicarán únicamente los cargos válidamente pactados por escrito y permitidos por la normativa vigente. La tarifa configurada en el sistema es de ${money(s.dailyLateFee)} por día, con ${Number(s.lateFeeGrace||0)} días de gracia; su exigibilidad debe confirmarse con las condiciones particulares firmadas y la legislación aplicable. No se autoriza cobro abusivo, amenazas, hostigamiento ni divulgación de la deuda a terceros.</p><h3>QUINTA: OBLIGACIONES DE LAS PARTES</h3><p>EL PRESTATARIO se obliga a cumplir el cronograma y comunicar oportunamente cualquier discrepancia en sus pagos. EL PRESTAMISTA se obliga a registrar fielmente los pagos recibidos, proporcionar información clara sobre el saldo y efectuar gestiones de cobranza lícitas y respetuosas.</p><h3>SEXTA: DATOS PERSONALES Y CONFIDENCIALIDAD</h3><p>Las partes se comprometen a tratar los datos personales únicamente para fines legítimos relacionados con la evaluación, administración y cumplimiento del préstamo, con acceso limitado y conforme a la normativa de protección de datos aplicable. No se permite publicar fotografías, documentos o información de deuda para avergonzar, amenazar o presionar al prestatario.</p><h3>SÉPTIMA: COMUNICACIONES Y SOLUCIÓN DE CONTROVERSIAS</h3><p>Las partes podrán coordinar por los datos de contacto proporcionados, sin afectar derechos legales. Cualquier controversia procurará resolverse de buena fe y, de persistir, por las vías competentes conforme a la legislación peruana.</p><h3>OCTAVA: ACEPTACIÓN Y FIRMA</h3><p>Las partes declaran haber leído y comprendido las condiciones y reciben copia del contrato y cronograma. Método previsto: <b>${esc(l.signMethod)}</b>. Si se utiliza firma electrónica, deberá completarse mediante una plataforma externa apropiada que permita identificar a los firmantes y conservar evidencia verificable.</p><h3>ANEXO 1: CRONOGRAMA DE PAGOS</h3><table><thead><tr><th>Cuota</th><th>Fecha de vencimiento</th><th>Importe</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="2">TOTAL</th><th>${money(l.total)}</th></tr></tfoot></table><div class="signature"><div class="sigline">EL PRESTAMISTA<br>${esc(s.company||'Nombre / razón social')}<br>RUC: ${esc(s.ruc||'________________')}</div><div class="sigline">EL PRESTATARIO<br>${esc(c.name)}<br>DNI/RUC: ${esc(c.doc||'________________')}</div></div><p style="margin-top:28px"><b>Consentimiento opcional y separado para fotografía de identificación interna:</b> No se autoriza el uso publicitario ni la publicación de imagen o datos relacionados con la deuda. Si se requiere una fotografía para identificación administrativa, deberá recabarse un consentimiento separado, específico, informado y revocable, indicando finalidad, plazo y responsable del tratamiento, conforme a la normativa aplicable. <br>☐ Deseo recibir información separada sobre dicho tratamiento. Esta casilla no constituye autorización de publicación ni condición para otorgar el préstamo.</p><p>Firmado en ____________________, a los ____ días del mes de ______________ de ______.</p><p><b>Nota:</b> Modelo referencial que debe ser revisado y adaptado por un profesional legal en Perú antes de su uso.</p></div>`;openModal('Contrato '+l.code,text)}
function reportsPage0(){let active=db.loans.filter(l=>!l.cancelled),received=db.payments.reduce((s,p)=>s+Number(p.amount),0),receivedCuotas=db.payments.filter(p=>p.kind==='installment').reduce((s,p)=>s+Number(p.amount),0),receivedMora=db.payments.filter(p=>p.kind==='mora').reduce((s,p)=>s+Number(p.amount),0),principal=active.reduce((s,l)=>s+Number(l.capital),0),total=active.reduce((s,l)=>s+Number(l.total),0);return `<div class="cards"><div class="card"><div class="metric-label">Capital colocado activo</div><div class="metric">${money(principal)}</div></div><div class="card"><div class="metric-label">Total pactado activo</div><div class="metric">${money(total)}</div></div><div class="card"><div class="metric-label">Pagos registrados (todos)</div><div class="metric">${money(received)}</div></div><div class="card"><div class="metric-label">Saldo activo por cobrar</div><div class="metric">${money(active.reduce((s,l)=>s+loanOutstanding(l),0))}</div></div></div><div class="panel"><h2>Desglose de ingresos registrados</h2><div class="kpis"><span class="pill">Abonos a cuotas: <b>${money(receivedCuotas)}</b></span><span class="pill">Pagos de mora: <b>${money(receivedMora)}</b></span><span class="pill">Mora estimada pendiente: <b>${money(active.reduce((s,l)=>s+dueMora(l),0))}</b></span></div><div class="actions"><button class="primary" onclick="exportCSV('loans')">Exportar préstamos CSV</button><button class="soft" onclick="exportCSV('payments')">Exportar pagos CSV</button><button class="soft" onclick="exportCSV('clients')">Exportar clientes CSV</button><button class="soft" onclick="exportCSV('schedule')">Exportar cronogramas CSV</button></div></div><div class="panel"><h2>Notas para interpretar</h2><p>El “saldo por cobrar” resta los pagos clasificados como cuota del monto total pactado. Los pagos de mora se registran por separado y no reducen el saldo de cuotas. La utilidad mostrada no es una utilidad contable ni considera gastos, impuestos, incobrables u otros costos.</p></div>`}

function saveSettings0(e){e.preventDefault();let ruc=$('sruc').value.trim();if(ruc&&!/^\d{11}$/.test(ruc)){alert('El RUC debe contener 11 dígitos.');return}db.settings={...db.settings,company:$('scompany').value.trim(),ruc,representative:$('srep').value.trim(),address:$('saddress').value.trim(),phone:$('sphone').value.trim(),dailyLateFee:+$('sfee').value,lateFeeGrace:+$('sgrace').value};log('Configuración del prestamista actualizada');save()}

function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function filterTable(input,id){let q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
function csvDownload(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCSV(type){if(type==='clients')csvDownload('finwise_clientes.csv',[['Nombre','Documento','Teléfono','Dirección','Correo','Notas'],...db.clients.map(c=>[c.name,c.doc,c.phone,c.address,c.email,c.note])]);if(type==='loans')csvDownload('finwise_prestamos.csv',[['Código','Cliente','Capital','Total','Pagado cuotas','Saldo','Frecuencia','Cuotas','Cobrador','Anulado'],...db.loans.map(l=>[l.code,client(l.clientId).name,l.capital,l.total,paidTotal(l.id),loanOutstanding(l),l.frequency,l.installments,l.collector,l.cancelled?'Sí':'No'])]);if(type==='payments')csvDownload('finwise_pagos.csv',[['Fecha','Préstamo','Cliente','Tipo','Cuota','Importe','Medio','Observación'],...db.payments.map(p=>{let l=loan(p.loanId);return[p.date,l?.code||'',l?client(l.clientId).name:'',p.kind,p.installment,p.amount,p.method,p.note]})]);if(type==='schedule')csvDownload('finwise_cronogramas.csv',[['Préstamo','Cliente','Cuota','Vencimiento','Importe','Pagado','Saldo','Mora estimada'],...db.loans.filter(l=>!l.cancelled).flatMap(l=>schedule(l).map(r=>{let st=installmentStatus(l,r);return[l.code,client(l.clientId).name,r.n,r.due,r.amount,st.paid,st.balance,st.late]}))])}function downloadLoanCSV(id){let l=loan(id);csvDownload(l.code+'_cronograma.csv',[['Préstamo','Cliente','Cuota','Vencimiento','Importe','Pagado','Saldo','Mora estimada'],...schedule(l).map(r=>{let st=installmentStatus(l,r);return[l.code,client(l.clientId).name,r.n,r.due,r.amount,st.paid,st.balance,st.late]})])}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='finwise_respaldo_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importBackup(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.clients||!x.loans||!x.payments||!x.settings)throw Error('Formato inválido');if(!confirm('Restaurar esta copia reemplazará los datos actuales de este navegador. ¿Continuar?'))return;db={...blank(),...x};save();alert('Copia restaurada.')}catch(err){alert('No se pudo restaurar: '+err.message)}e.target.value=''};rd.readAsText(f)}function clearAll(){if(prompt('Para confirmar, escribe BORRAR TODO')!=='BORRAR TODO')return;if(confirm('Esta acción no se puede deshacer. ¿Borrar todos los datos locales?')){db=blank();save()}}

/* ===== MEJORAS ===== */
function waLink(ph,msg){let d=String(ph||'').replace(/\D/g,'');if(d.length===9)d='51'+d;return d?'https://wa.me/'+d+'?text='+encodeURIComponent(msg).replace(/'/g,'%27'):''}
function pct(l){return Math.min(100,Math.round(paidTotal(l.id)/Number(l.total||1)*100))}
function loanLate(l){return schedule(l).some(r=>{let st=installmentStatus(l,r);return st.balance>0&&r.due<today()})}
function statusTag(l){if(loanOutstanding(l)<=0)return '<span class="tag ok">Pagado</span>';if(loanLate(l))return '<span class="tag bad">Vencido</span>';return '<span class="tag warn">Activo</span>'}
function overdueList(){let r=[];db.loans.filter(l=>!l.cancelled).forEach(l=>schedule(l).forEach(s=>{let st=installmentStatus(l,s);if(st.balance>0&&s.due<today())r.push({l,r:s,st})}));return r.sort((a,b)=>b.st.days-a.st.days)}
function remind(lid,n){let l=loan(lid),c=client(l.clientId),row=schedule(l).find(r=>r.n===n),st=installmentStatus(l,row);let u=waLink(c.phone,`Hola ${c.name}, le saludamos de ${db.settings.company}. Le recordamos que su cuota ${n} del préstamo ${l.code} por ${money(st.balance)} ${row.due<today()?'venció':'vence'} el ${fmt(row.due)}. Gracias por su atención.`);if(!u){alert('Este cliente no tiene teléfono registrado.');return}window.open(u,'_blank')}
function monthsBack(n){let a=[],d=new Date();for(let i=n-1;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return a}
function chart6(){let ms=monthsBack(6),v=ms.map(m=>db.payments.filter(p=>p.date.slice(0,7)===m).reduce((s,p)=>s+Number(p.amount),0)),mx=Math.max(...v,1),nm=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return '<svg viewBox="0 0 360 150" style="width:100%;max-height:210px">'+v.map((x,i)=>{let h=x/mx*95;return `<rect x="${i*60+12}" y="${120-h}" width="36" height="${h}" rx="5" fill="#d7b56d"/><text x="${i*60+30}" y="138" text-anchor="middle" font-size="11" fill="#6b7788">${nm[+ms[i].slice(5)-1]}</text><text x="${i*60+30}" y="${114-h}" text-anchor="middle" font-size="10" fill="#172436">${x?Math.round(x):''}</text>`}).join('')+'</svg>'}
function dashboard(){let act=db.loans.filter(l=>!l.cancelled),t=today(),sum=a=>a.reduce((s,x)=>s+Number(x.amount),0),out=act.reduce((s,l)=>s+loanOutstanding(l),0),late=act.reduce((s,l)=>s+dueMora(l),0),gain=act.reduce((s,l)=>s+Number(l.total)-Number(l.capital),0),od=overdueList(),odAmt=od.reduce((s,x)=>s+x.st.balance,0),cobHoy=sum(db.payments.filter(p=>p.date===t)),cobMes=sum(db.payments.filter(p=>p.date.slice(0,7)===t.slice(0,7))),rate=out?Math.round(odAmt/out*100):0,up=[];act.forEach(l=>schedule(l).forEach(r=>{let st=installmentStatus(l,r);if(st.balance>0&&r.due>=t&&r.due<=addDays(t,7))up.push({l,r,st})}));up.sort((a,b)=>a.r.due.localeCompare(b.r.due));let lb=localStorage.getItem('finwise-last-backup'),warn=db.clients.length&&(!lb||(Date.now()-new Date(lb))/864e5>7);
const row=(x,tag)=>`<tr><td>${esc(client(x.l.clientId).name)}<div class="muted">${esc(x.l.code)} · cuota ${x.r.n}</div></td><td>${fmt(x.r.due)}${tag&&x.st.days?` <span class="tag bad">${x.st.days} d</span>`:''}</td><td>${money(x.st.balance)}</td><td><button class="soft mini" onclick="quickPayment('${x.l.id}',${x.r.n})">Cobrar</button> <button class="gold mini" onclick="remind('${x.l.id}',${x.r.n})">WhatsApp</button></td></tr>`;
const tb=(rows,tag,empty)=>rows.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Vence</th><th>Saldo</th><th></th></tr></thead><tbody>${rows.slice(0,8).map(x=>row(x,tag)).join('')}</tbody></table></div>`+(rows.length>8?`<p class="small muted">Y ${rows.length-8} más en Cartera y mora.</p>`:''):`<div class="empty">${empty}</div>`;
return (warn?`<div class="notice"><b>Respaldo:</b> hace más de 7 días no descargas una copia. <button class="gold mini" onclick="exportBackup()">Descargar ahora</button></div>`:'')+`<div class="cards"><div class="card"><div class="metric-label">Cobrado hoy</div><div class="metric">${money(cobHoy)}</div></div><div class="card"><div class="metric-label">Cobrado este mes</div><div class="metric">${money(cobMes)}</div></div><div class="card"><div class="metric-label">Saldo por cobrar</div><div class="metric">${money(out)}</div></div><div class="card"><div class="metric-label">Ganancia pactada (intereses)</div><div class="metric">${money(gain)}</div></div><div class="card alert"><div class="metric-label">Cuotas vencidas</div><div class="metric">${od.length} · ${money(odAmt)}</div></div><div class="card alert"><div class="metric-label">Índice de morosidad</div><div class="metric">${rate}%</div></div><div class="card"><div class="metric-label">Mora estimada</div><div class="metric">${money(late)}</div></div><div class="card"><div class="metric-label">Clientes · Préstamos activos</div><div class="metric">${db.clients.length} · ${act.length}</div></div></div><div class="panel"><div class="row"><h2>Acciones rápidas</h2><button class="primary fit" onclick="go('loans')">+ Nuevo préstamo</button><button class="soft fit" onclick="go('clients')">+ Nuevo cliente</button><button class="gold fit" onclick="go('payments')">↗ Registrar pago</button></div></div><div class="grid2"><div class="panel"><h2>Por cobrar en 7 días</h2>${tb(up,false,'Sin vencimientos próximos.')}</div><div class="panel"><h2>Cuotas vencidas (más atrasadas)</h2>${tb(od,true,'¡Sin atrasos!')}</div></div><div class="grid2"><div class="panel"><h2>Cobros de los últimos 6 meses (S/)</h2>${chart6()}</div><div class="panel"><h2>Actividad reciente</h2>${db.audit.length?`<div class="tablewrap"><table><tbody>${db.audit.slice(0,7).map(a=>`<tr><td>${new Date(a.at).toLocaleString('es-PE')}</td><td>${esc(a.msg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay movimientos.</div>'}</div></div><p class="small muted">La mora es un cálculo orientativo según días de atraso y tarifa configurada; verifica que esté pactada con el cliente y sea legal.</p>`}
function addPayment(e){e.preventDefault();let l=loan($('ppLoan').value),kind=$('pkind').value,inst=+$('pinst').value,amount=+$('pamount').value,date=$('pdate').value,method=$('pmethod').value,note=$('pnote').value.trim();if(!l||amount<=0){alert('Selecciona préstamo e importe válido.');return}if(kind==='installment'&&amount>loanOutstanding(l)+0.01&&!confirm('El importe supera el saldo del préstamo. ¿Registrar de todos modos?'))return;let made=[];const mk=(n,a)=>{let p={id:uid(),loanId:l.id,kind,installment:n,amount:round(a),date,method,note,created:new Date().toISOString()};db.payments.push(p);made.push(p)};
if(inst)mk(inst,amount);else if(kind==='mora'){let r=schedule(l).find(r=>installmentStatus(l,r).late>0)||{n:1};mk(r.n,amount)}else{let rest=amount;schedule(l).forEach(r=>{if(rest<=0.009)return;let b=installmentStatus(l,r).balance,a=Math.min(rest,b);if(a>0){mk(r.n,a);rest=round(rest-a)}});if(rest>0.009)mk(schedule(l).slice(-1)[0].n,rest)}
log('Pago '+money(amount)+' registrado en '+l.code+' ('+(kind==='mora'?'mora':inst?'cuota '+inst:'abono automático')+')');save();receipt(made.map(p=>p.id))}
document.addEventListener('change',e=>{if(e.target.id==='pinst'&&e.target.value){let l=loan($('ppLoan').value),r=schedule(l).find(x=>x.n==e.target.value),st=installmentStatus(l,r);$('pamount').value=$('pkind').value==='mora'?st.late:st.balance}});
function receipt(ids){ids=[].concat(ids);let ps=ids.map(id=>db.payments.find(p=>p.id===id)).filter(Boolean);if(!ps.length)return;let p=ps[0],l=loan(p.loanId);if(!l)return;let c=client(l.clientId),s=db.settings,tot=ps.reduce((a,x)=>a+Number(x.amount),0),u=waLink(c.phone,`Hola ${c.name}, confirmamos su pago de ${money(tot)} del préstamo ${l.code} (${fmt(p.date)}). Saldo pendiente: ${money(loanOutstanding(l))}. ${s.company}`);openModal('Recibo de pago',`<div class="contract"><h2>${esc(s.company)}</h2><p style="text-align:center">${s.ruc?'RUC '+esc(s.ruc)+' · ':''}${esc(s.address)} ${esc(s.phone)}</p><h3>RECIBO DE PAGO N° ${esc(p.id.slice(-6).toUpperCase())}</h3><p>Fecha: <b>${fmt(p.date)}</b> · Medio: ${esc(p.method)}</p><p>Recibimos de <b>${esc(c.name)}</b> ${c.doc?'(Doc. '+esc(c.doc)+')':''} la suma de <b>${money(tot)}</b> por concepto de ${p.kind==='mora'?'pago de mora':'pago de cuotas'} del préstamo ${esc(l.code)}.</p><table><tr><th>Cuota</th><th>Importe</th></tr>${ps.map(x=>`<tr><td>${x.installment}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><p>Saldo pendiente del préstamo: <b>${money(loanOutstanding(l))}</b></p><div class="signature"><div class="sigline">Recibí conforme (prestamista)</div><div class="sigline">Cliente</div></div>${u?`<p class="no-print" style="text-align:center"><button class="gold" onclick="window.open('${u}','_blank')">Enviar confirmación por WhatsApp</button></p>`:''}</div>`)}
function voidPayment(id){let p=db.payments.find(x=>x.id===id);if(!p)return;let why=prompt('Motivo de anulación del pago de '+money(p.amount)+':');if(why===null)return;if(!why.trim()){alert('Indica el motivo.');return}db.voided=db.voided||[];db.voided.push({...p,reason:why.trim(),voidedAt:new Date().toISOString()});db.payments=db.payments.filter(x=>x.id!==id);log('Pago anulado '+money(p.amount)+': '+why);save()}
function editClient(id){let c=client(id);openModal('Editar cliente',`<form onsubmit="saveClient(event,'${id}')"><div class="formgrid"><div class="field"><label>Nombre *</label><input id="ename" value="${esc(c.name)}" required></div><div class="field"><label>DNI / RUC</label><input id="edoc" value="${esc(c.doc)}" maxlength="11"></div><div class="field"><label>Teléfono</label><input id="ephone" value="${esc(c.phone)}"></div><div class="field"><label>Dirección</label><input id="eaddr" value="${esc(c.address)}"></div><div class="field"><label>Correo</label><input id="eemail" value="${esc(c.email)}"></div><div class="field"><label>Notas</label><input id="enote" value="${esc(c.note)}"></div></div><div class="actions"><button class="primary">Guardar cambios</button></div></form>`)}
function saveClient(e,id){e.preventDefault();let c=db.clients.find(x=>x.id===id);Object.assign(c,{name:$('ename').value.trim(),doc:$('edoc').value.trim(),phone:$('ephone').value.trim(),address:$('eaddr').value.trim(),email:$('eemail').value.trim(),note:$('enote').value.trim()});log('Cliente editado: '+c.name);closeModal();save()}
function addClient(e){e.preventDefault();let d=$('cdoc').value.trim();if(d&&db.clients.some(c=>c.doc===d)){alert('Ya existe un cliente con ese documento.');return}let c={id:uid(),name:$('cname').value.trim(),doc:d,phone:$('cphone').value.trim(),address:$('caddress').value.trim(),email:$('cemail').value.trim(),note:$('cnote').value.trim(),created:today()};db.clients.push(c);log('Cliente registrado: '+c.name);save()}
function clientDetail(id){let c=client(id),ls=db.loans.filter(l=>l.clientId===id&&!l.cancelled),pays=db.payments.filter(p=>ls.some(l=>l.id===p.loanId)).sort((a,b)=>b.date.localeCompare(a.date));openModal('Estado de cuenta',`<div class="contract"><h2>${esc(c.name)}</h2><p>Documento: ${esc(c.doc||'—')} · Teléfono: ${esc(c.phone||'—')} · Dirección: ${esc(c.address||'—')}</p><p>Notas: ${esc(c.note||'—')}</p><h3>Préstamos</h3><table><tr><th>Código</th><th>Capital</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Mora</th></tr>${ls.map(l=>`<tr><td>${esc(l.code)}</td><td>${money(l.capital)}</td><td>${money(l.total)}</td><td>${money(paidTotal(l.id))}</td><td>${money(loanOutstanding(l))}</td><td>${money(dueMora(l))}</td></tr>`).join('')||'<tr><td colspan="6">Sin préstamos</td></tr>'}</table><h3>Pagos</h3><table><tr><th>Fecha</th><th>Préstamo</th><th>Tipo</th><th>Importe</th></tr>${pays.map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(loan(p.loanId).code)}</td><td>${p.kind==='mora'?'Mora':'Cuota '+p.installment}</td><td>${money(p.amount)}</td></tr>`).join('')||'<tr><td colspan="4">Sin pagos</td></tr>'}</table></div>`)}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='finwise_respaldo_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);localStorage.setItem('finwise-last-backup',new Date().toISOString());if(page==='dashboard')render()}

function schedule(l){let r=schedule0(l);if(l.resched)r.forEach(x=>{if(l.resched[x.n])x.due=l.resched[x.n]});return r}
function riskTag(id){let ls=db.loans.filter(l=>l.clientId===id&&!l.cancelled);if(!ls.length)return '';let mx=0;ls.forEach(l=>schedule(l).forEach(r=>{let st=installmentStatus(l,r);if(st.balance>0&&st.days>mx)mx=st.days}));return mx>30?'<span class="tag bad">Riesgo alto</span>':mx>0?'<span class="tag warn">Con atraso</span>':'<span class="tag ok">Al día</span>'}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('finwise-dark',document.body.classList.contains('dark')?'1':'')}
if(localStorage.getItem('finwise-dark'))document.body.classList.add('dark');
function hashPin(p){let h=2166136261;for(const c of 'fw|'+p){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return String(h>>>0)}
function lockApp(){if(!db.settings.pinHash){alert('Primero crea un PIN en Configuración.');return}showLock()}
function showLock(){if($('lock'))return;let d=document.createElement('div');d.id='lock';d.style.cssText='position:fixed;inset:0;background:#081b33;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff';d.innerHTML='<div style="font-size:26px;font-weight:850">FinWise</div><div style="color:#d7b56d">Ingresa tu PIN</div><input id="lockpin" type="password" inputmode="numeric" maxlength="8" style="padding:12px;border-radius:8px;border:0;text-align:center;font-size:20px;width:180px"><button class="gold" id="lockbtn">Entrar</button><div id="lockerr" style="color:#fca5a5"></div>';document.body.appendChild(d);const t=()=>{if(hashPin($('lockpin').value)===db.settings.pinHash)d.remove();else{$('lockerr').textContent='PIN incorrecto';$('lockpin').value=''}};$('lockbtn').onclick=t;$('lockpin').onkeydown=e=>{if(e.key==='Enter')t()};$('lockpin').focus()}
function setPin(e){e.preventDefault();let p=$('npin').value;if(!/^\d{4,8}$/.test(p)){alert('El PIN debe tener de 4 a 8 dígitos.');return}if(p!==$('npin2').value){alert('Los PIN no coinciden.');return}if(db.settings.pinHash&&hashPin($('opin').value)!==db.settings.pinHash){alert('El PIN actual es incorrecto.');return}db.settings.pinHash=hashPin(p);log('PIN actualizado');save();alert('PIN guardado.')}
function removePin(){let p=prompt('Escribe tu PIN actual para quitarlo:');if(p===null)return;if(hashPin(p)!==db.settings.pinHash){alert('PIN incorrecto.');return}delete db.settings.pinHash;log('PIN eliminado');save()}
function settingsPage(){return settingsPage0()+`<div class="panel"><h2>Bloqueo con PIN</h2><p class="small muted">Se bloquea al abrir la app y tras 5 minutos sin uso. Protege de miradas casuales; no cifra los datos guardados.</p><form onsubmit="setPin(event)"><div class="formgrid">${db.settings.pinHash?'<div class="field"><label>PIN actual</label><input id="opin" type="password" inputmode="numeric" maxlength="8"></div>':'<input id="opin" type="hidden">'}<div class="field"><label>Nuevo PIN (4–8 dígitos)</label><input id="npin" type="password" inputmode="numeric" maxlength="8" required></div><div class="field"><label>Repetir PIN</label><input id="npin2" type="password" inputmode="numeric" maxlength="8" required></div></div><div class="actions"><button class="primary">${db.settings.pinHash?'Cambiar PIN':'Activar PIN'}</button>${db.settings.pinHash?'<button type="button" class="danger" onclick="removePin()">Quitar PIN</button>':''}</div></form></div>`}
function saveSettings(e){let h=db.settings.pinHash;saveSettings0(e);if(h&&!db.settings.pinHash){db.settings.pinHash=h;save()}}
let _act=Date.now();['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>_act=Date.now()));setInterval(()=>{if(db.settings.pinHash&&Date.now()-_act>300000)showLock()},30000);
function calcLoanPreview(){if(!$('lcapital'))return;let cap=+$('lcapital').value||0,total=$('lmode').value==='manual'?(+$('lmanual').value||0):cap*(1+(+$('lrate').value||0)/100),n=Math.max(1,Math.min(500,+$('linst').value||1)),rows=schedule0({total,installments:n,frequency:$('lfrequency').value,startDate:$('lstart').value||today(),firstDue:$('ldue').value||today()});$('loanPreview').innerHTML=`Capital: <b>${money(cap)}</b> · Total: <b>${money(total)}</b> · Cuota: <b>${money(total/n)}</b> · Interés: <b>${money(total-cap)}</b> (${cap?Math.round((total-cap)/cap*1000)/10:0}%)`+(total<cap?'<br><b style="color:#b42318">El total no puede ser menor al capital.</b>':'')+`<details><summary>Ver cronograma previo (${n} cuotas)</summary><table>${rows.slice(0,24).map(r=>`<tr><td>Cuota ${r.n}</td><td>${fmt(r.due)}</td><td>${money(r.amount)}</td></tr>`).join('')}</table></details>`}
document.addEventListener('change',e=>{let i=e.target.id;if(i==='lfrequency'||i==='lstart'){let st=$('lstart').value||today(),f=$('lfrequency').value;$('ldue').value=f==='Mensual'?plusMonths(st,1):addDays(st,{Diario:1,Semanal:7,Quincenal:15}[f])}if(['lfrequency','lstart','ldue'].includes(i))calcLoanPreview()});
function loanDetail(id){loanDetail0(id);let l=loan(id);if(!l||l.cancelled)return;let c=client(l.clientId),u=waLink(c.phone,`Hola ${c.name}, este es el cronograma de su préstamo ${l.code} (${db.settings.company}):\n`+schedule(l).map(r=>`Cuota ${r.n}: ${fmt(r.due)} - ${money(r.amount)}`).join('\n'));$('modalBody').insertAdjacentHTML('afterbegin',`<div class="actions no-print"><button class="gold" onclick="liquidate('${id}')">Liquidar préstamo</button><button class="soft" onclick="reschedule('${id}')">Reprogramar cuota</button><button class="soft" onclick="refinance('${id}')">Refinanciar</button>${u?`<button class="soft" onclick="window.open('${u}','_blank')">Cronograma por WhatsApp</button>`:''}</div>`)}
function liquidate(id){closeModal();quickPayment(id,'');setTimeout(()=>{let l=loan(id);if($('pamount')){$('pamount').value=loanOutstanding(l);$('pnote').value='Liquidación total'}},150)}
function reschedule(id){let l=loan(id),n=+prompt('Número de cuota a reprogramar:');if(!n||!schedule(l).some(r=>r.n===n)){alert('Cuota no válida.');return}let d=prompt('Nueva fecha de vencimiento (AAAA-MM-DD):');if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d))){alert('Fecha no válida.');return}l.resched=l.resched||{};l.resched[n]=d;log('Cuota '+n+' de '+l.code+' reprogramada al '+d);save();loanDetail(id)}
function refinance(id){let l=loan(id),out=loanOutstanding(l);if(out<=0){alert('Este préstamo ya está pagado.');return}let r=prompt('Interés total (%) sobre el saldo de '+money(out)+':',String(l.rate??20));if(r===null)return;let n=prompt('Número de cuotas del nuevo préstamo:','4');if(n===null)return;r=+r;n=+n;if(!(r>=0)||!(n>=1)){alert('Datos no válidos.');return}if(!confirm('Se creará un préstamo nuevo por '+money(out)+' y el actual quedará como refinanciado (sale de la cartera activa; sus pagos se conservan). La mora pendiente no se incluye. ¿Continuar?'))return;let nl={...l,id:uid(),code:'FW-'+new Date().getFullYear()+'-'+String(db.loans.length+1).padStart(4,'0'),capital:out,mode:'percent',rate:r,total:round(out*(1+r/100)),installments:n,startDate:today(),firstDue:l.frequency==='Mensual'?plusMonths(today(),1):addDays(today(),{Diario:1,Semanal:7,Quincenal:15}[l.frequency]),cancelled:false,cancelReason:'',resched:undefined,created:today(),reason:'Refinanciamiento de '+l.code};l.cancelled=true;l.cancelReason='Refinanciado en '+nl.code;l.cancelledAt=today();db.loans.unshift(nl);log('Préstamo '+l.code+' refinanciado en '+nl.code);closeModal();save();setTimeout(()=>loanDetail(nl.id),100)}
let colCollector='__all',colDate=today();
function collectionItems(){let r=[];db.loans.filter(l=>!l.cancelled).forEach(l=>{if(colCollector!=='__all'&&(l.collector||'')!==colCollector)return;schedule(l).forEach(s=>{let st=installmentStatus(l,s);if(st.balance>0&&s.due<=colDate)r.push({l,r:s,st,c:client(l.clientId)})})});return r.sort((a,b)=>(a.l.collector||'~').localeCompare(b.l.collector||'~')||b.st.days-a.st.days)}
function collectionPage(){let it=collectionItems(),tot=it.reduce((s,x)=>s+x.st.balance,0),ph=x=>x.c.phone?`<a href="tel:${esc(x.c.phone)}">${esc(x.c.phone)}</a>`:'—';return `<div class="panel"><h2>Hoja de cobranza</h2><div class="formgrid"><div class="field"><label>Cobrador</label><select onchange="colCollector=this.value;render()"><option value="__all">Todos</option><option value="" ${colCollector===''?'selected':''}>Sin asignar</option>${db.collectors.map(c=>`<option ${colCollector===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Cobrar hasta la fecha</label><input type="date" value="${colDate}" onchange="colDate=this.value||today();render()"></div></div><div class="kpis" style="margin-top:12px"><span class="pill">Cuotas: <b>${it.length}</b></span><span class="pill">Por cobrar: <b>${money(tot)}</b></span><span class="pill">Mora estimada: <b>${money(it.reduce((s,x)=>s+x.st.late,0))}</b></span></div><div class="actions"><button class="primary" onclick="routeSheet()">Imprimir hoja de ruta</button></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Cobrador</th><th>Cliente</th><th>Teléfono</th><th>Dirección</th><th>Préstamo · cuota</th><th>Vence</th><th>Atraso</th><th>Saldo</th><th></th></tr></thead><tbody>${it.map(x=>`<tr><td>${esc(x.l.collector||'—')}</td><td>${esc(x.c.name)}</td><td>${ph(x)}</td><td>${esc(x.c.address||'—')}</td><td>${esc(x.l.code)} · ${x.r.n}</td><td>${fmt(x.r.due)}</td><td>${x.st.days?`<span class="tag bad">${x.st.days} d</span>`:'Hoy'}</td><td>${money(x.st.balance)}</td><td><button class="soft mini" onclick="quickPayment('${x.l.id}',${x.r.n})">Cobrar</button> <button class="gold mini" onclick="remind('${x.l.id}',${x.r.n})">WhatsApp</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nada pendiente para esta fecha.</td></tr>'}</tbody></table></div></div>`}
function routeSheet(){let it=collectionItems();openModal('Hoja de ruta',`<div class="contract"><h2>${esc(db.settings.company)} — Hoja de cobranza</h2><p>Fecha: <b>${fmt(colDate)}</b> · Cobrador: <b>${colCollector==='__all'?'Todos':esc(colCollector||'Sin asignar')}</b></p><table><tr><th>Cliente</th><th>Dirección</th><th>Tel.</th><th>Préstamo/cuota</th><th>Atraso</th><th>Monto</th><th>Cobrado</th></tr>${it.map(x=>`<tr><td>${esc(x.c.name)}</td><td>${esc(x.c.address||'')}</td><td>${esc(x.c.phone||'')}</td><td>${esc(x.l.code)}/${x.r.n}</td><td>${x.st.days||0} d</td><td>${money(x.st.balance)}</td><td>☐</td></tr>`).join('')}<tr><th colspan="5">Total</th><th colspan="2">${money(it.reduce((s,x)=>s+x.st.balance,0))}</th></tr></table></div>`)}
function reportsPage(){let od=overdueList(),aging=[['1–7 días',1,7],['8–30 días',8,30],['31–60 días',31,60],['Más de 60 días',61,1e9]].map(([n,a,z])=>{let x=od.filter(o=>o.st.days>=a&&o.st.days<=z);return `<tr><td>${n}</td><td>${x.length}</td><td>${money(x.reduce((s,o)=>s+o.st.balance,0))}</td></tr>`}).join(''),sm=(a,f)=>a.reduce((s,x)=>s+Number(f(x)),0),mt=monthsBack(12).reverse().map(m=>{let ps=db.payments.filter(p=>p.date.slice(0,7)===m),ls=db.loans.filter(l=>!l.cancelled&&String(l.startDate).slice(0,7)===m);return `<tr><td>${m}</td><td>${ls.length}</td><td>${money(sm(ls,l=>l.capital))}</td><td>${money(sm(ps.filter(p=>p.kind==='installment'),p=>p.amount))}</td><td>${money(sm(ps.filter(p=>p.kind==='mora'),p=>p.amount))}</td></tr>`}).join(''),names=[...db.collectors,''],bc=names.map(n=>{let ls=db.loans.filter(l=>!l.cancelled&&(l.collector||'')===n);if(!ls.length)return '';let o=overdueList().filter(x=>(x.l.collector||'')===n);return `<tr><td>${esc(n||'Sin asignar')}</td><td>${ls.length}</td><td>${money(sm(ls,loanOutstanding))}</td><td>${money(sm(o,x=>x.st.balance))}</td><td>${money(sm(db.payments.filter(p=>ls.some(l=>l.id===p.loanId)),p=>p.amount))}</td></tr>`}).join('');return reportsPage0()+`<div class="grid2"><div class="panel"><h2>Antigüedad de la mora</h2><table><thead><tr><th>Tramo</th><th>Cuotas</th><th>Monto vencido</th></tr></thead><tbody>${aging}</tbody></table></div><div class="panel"><h2>Rendimiento por cobrador</h2><div class="tablewrap"><table><thead><tr><th>Cobrador</th><th>Préstamos</th><th>Saldo</th><th>Vencido</th><th>Cobrado</th></tr></thead><tbody>${bc||'<tr><td colspan="5" class="empty">Sin datos</td></tr>'}</tbody></table></div></div></div><div class="panel"><h2>Colocado vs. cobrado por mes</h2><div class="tablewrap"><table><thead><tr><th>Mes</th><th>Préstamos nuevos</th><th>Capital colocado</th><th>Cobro de cuotas</th><th>Cobro de mora</th></tr></thead><tbody>${mt}</tbody></table></div></div>`}

/* ===== MODO EN LÍNEA (usuarios + administrador) ===== */
let sb,me=null,isAdmin=false,_pt,_pending=false,_adm={},adminSeen='';
function withDb(d,fn){let bak=db;db={...blank(),...(d||{})};try{return fn()}finally{db=bak}}
function setSync(t,bad){let e=$('syncinfo');if(e){e.textContent=t;e.style.color=bad?'#fca5a5':'#86efac'}}
function cloudPush(now){if(!CLOUD||!me)return;_pending=true;setSync('Guardando…');clearTimeout(_pt);_pt=setTimeout(async()=>{try{let r=await sb.from('workspaces').upsert({user_id:me.id,data:db,updated_at:new Date().toISOString()});if(r.error)throw r.error;_pending=false;setSync('Sincronizado ✓')}catch(e){setSync('Sin sincronizar: '+(e.message||'error de red'),1)}},now?0:800)}
window.addEventListener('beforeunload',e=>{if(_pending){e.preventDefault();e.returnValue=''}});
function cloudInit(){if(!CLOUD)return;if(typeof supabase==='undefined'){document.body.innerHTML='<p style="padding:30px;font:16px system-ui">No se pudo cargar el servicio en línea. Revisa tu conexión a internet y recarga.</p>';return}sb=supabase.createClient(SB_URL,SB_KEY);sb.auth.getSession().then(({data})=>data&&data.session?enter(data.session.user):showLogin());setInterval(()=>{if(page==='admin'&&isAdmin)adminLoad()},20000)}
function showLogin(msg){let d=$('login');if(!d){d=document.createElement('div');d.id='login';d.style.cssText='position:fixed;inset:0;background:#081b33;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;padding:20px';document.body.appendChild(d)}d.innerHTML='<div style="font-size:28px;font-weight:850">FinWise</div><div style="color:#d7b56d;letter-spacing:2px;font-size:11px">GESTIÓN DE PRÉSTAMOS</div><input id="lgu" placeholder="Usuario" autocapitalize="off" style="padding:12px;border-radius:8px;border:0;width:250px;max-width:100%"><input id="lgp" type="password" placeholder="Contraseña" style="padding:12px;border-radius:8px;border:0;width:250px;max-width:100%"><button class="gold" id="lgb" style="width:250px;max-width:100%">Ingresar</button><div id="lge" style="color:#fca5a5;min-height:18px">'+esc(msg||'')+'</div>';$('lgb').onclick=doLogin;$('lgp').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('lgu').focus()}
async function doLogin(){let u=$('lgu').value.trim().toLowerCase().replace(/\s+/g,''),p=$('lgp').value;if(!u||!p){$('lge').textContent='Escribe usuario y contraseña.';return}$('lgb').disabled=true;let r=await sb.auth.signInWithPassword({email:u+'@finwise.app',password:p});if(r.error){$('lgb').disabled=false;$('lge').textContent='Usuario o contraseña incorrectos.';return}enter(r.data.user)}
async function enter(user){me=user;let pr=await sb.from('profiles').select('*').eq('id',user.id).single();me.profile=(pr&&pr.data)||{username:(user.email||'').split('@')[0],role:'user'};isAdmin=me.profile.role==='admin';let ws=await sb.from('workspaces').select('data').eq('user_id',user.id).maybeSingle();if(ws.data&&ws.data.data&&ws.data.data.clients){db={...blank(),...ws.data.data}}else{db=blank();let old=load();if(old.clients.length&&confirm('Tu cuenta está vacía. ¿Subir los datos que ya tenías guardados en este navegador?'))db=old;cloudPush(true)}let l=$('login');if(l)l.remove();$('navadmin').classList.toggle('hidden',!isAdmin);$('userbox').innerHTML='👤 <b>'+esc(me.profile.username)+'</b>'+(isAdmin?' (admin)':'')+'<br><span id="syncinfo" class="small">Sincronizado ✓</span><br><button class="soft mini" style="margin-top:8px" onclick="logout()">Cerrar sesión</button>';adminSeen=localStorage.getItem('finwise-admin-seen')||'';go(isAdmin?'admin':'dashboard')}
async function logout(){if(_pending&&!confirm('Hay cambios sin sincronizar. ¿Salir de todos modos?'))return;await sb.auth.signOut();location.reload()}
function adminPage(){if(!isAdmin)return '<div class="empty">Sin acceso.</div>';setTimeout(adminLoad,0);return '<div id="adm"><div class="empty">Cargando datos de todos los usuarios…</div></div>'}
async function adminLoad(){let box=$('adm');if(!box||!sb)return;let a=await sb.from('profiles').select('*'),b=await sb.from('workspaces').select('*');if(a.error||b.error){box.innerHTML='<div class="notice">No se pudo leer: '+esc((a.error||b.error).message)+'</div>';return}
let rows=(a.data||[]).map(p=>{let w=(b.data||[]).find(x=>x.user_id===p.id),d=w?w.data:null;_adm[p.id]={p,d};return{p,d,at:w&&w.updated_at,st:withDb(d,()=>{let ac=db.loans.filter(l=>!l.cancelled),sm=(x,f)=>x.reduce((s,y)=>s+Number(f(y)),0);return{clients:db.clients.length,loans:ac.length,capital:sm(ac,l=>l.capital),out:sm(ac,l=>loanOutstanding(l)),od:overdueList().reduce((s,x)=>s+x.st.balance,0),cob:sm(db.payments,p=>p.amount),hoy:sm(db.payments.filter(p=>p.date===today()),p=>p.amount)}})}});
let T=k=>rows.reduce((s,r)=>s+r.st[k],0),feed=[],loans=[];rows.forEach(r=>{(r.d&&r.d.audit||[]).forEach(x=>feed.push({u:r.p.username,at:x.at,msg:x.msg}));withDb(r.d,()=>db.loans.filter(l=>!l.cancelled).forEach(l=>loans.push({u:r.p.username,l,c:client(l.clientId).name})))});feed.sort((x,y)=>y.at.localeCompare(x.at));loans.sort((x,y)=>String(y.l.created).localeCompare(String(x.l.created)));let nw=feed.filter(x=>x.at>adminSeen).length;
box.innerHTML=`${nw&&adminSeen?`<div class="notice"><b>${nw} movimiento(s) nuevo(s)</b> desde tu última visita.</div>`:''}<div class="cards"><div class="card"><div class="metric-label">Usuarios</div><div class="metric">${rows.length}</div></div><div class="card"><div class="metric-label">Capital colocado (todos)</div><div class="metric">${money(T('capital'))}</div></div><div class="card"><div class="metric-label">Saldo por cobrar (todos)</div><div class="metric">${money(T('out'))}</div></div><div class="card alert"><div class="metric-label">Vencido (todos)</div><div class="metric">${money(T('od'))}</div></div><div class="card"><div class="metric-label">Cobrado hoy (todos)</div><div class="metric">${money(T('hoy'))}</div></div><div class="card"><div class="metric-label">Cobrado total</div><div class="metric">${money(T('cob'))}</div></div></div><div class="panel"><h2>Usuarios <span class="muted small">· actualizado ${new Date().toLocaleTimeString('es-PE')} (se refresca solo)</span></h2><div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Clientes</th><th>Préstamos activos</th><th>Capital</th><th>Saldo</th><th>Vencido</th><th>Cobrado hoy</th><th>Última actividad</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.p.username)}</b>${r.p.role==='admin'?' <span class="tag">admin</span>':''}</td><td>${r.st.clients}</td><td>${r.st.loans}</td><td>${money(r.st.capital)}</td><td>${money(r.st.out)}</td><td>${money(r.st.od)}</td><td>${money(r.st.hoy)}</td><td>${r.at?new Date(r.at).toLocaleString('es-PE'):'—'}</td><td><button class="soft mini" onclick="adminUser('${r.p.id}')">Ver detalle</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Últimos préstamos creados (todos)</h2><div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Código</th><th>Cliente</th><th>Capital</th><th>Total</th><th>Frecuencia</th><th>Fecha</th></tr></thead><tbody>${loans.slice(0,15).map(x=>`<tr><td>${esc(x.u)}</td><td>${esc(x.l.code)}</td><td>${esc(x.c)}</td><td>${money(x.l.capital)}</td><td>${money(x.l.total)}</td><td>${x.l.frequency}</td><td>${fmt(x.l.created)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin préstamos aún.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Movimientos recientes (todos)</h2><div class="tablewrap"><table><tbody>${feed.slice(0,60).map(x=>`<tr><td>${new Date(x.at).toLocaleString('es-PE')}</td><td><b>${esc(x.u)}</b></td><td>${esc(x.msg)} ${x.at>adminSeen&&adminSeen?'<span class="tag ok">NUEVO</span>':''}</td></tr>`).join('')||'<tr><td class="empty">Sin movimientos.</td></tr>'}</tbody></table></div></div>`;localStorage.setItem('finwise-admin-seen',new Date().toISOString())}

function clearAll(){if(CLOUD){alert('En modo en línea no se puede borrar todo. Pídeselo al administrador.');return}if(prompt('Para confirmar, escribe BORRAR TODO')!=='BORRAR TODO')return;if(confirm('Esta acción no se puede deshacer. ¿Borrar todos los datos locales?')){db=blank();save()}}
if(db.settings.pinHash)showLock();
// Initialize a blank local store without inserting fictitious customers or loans.
if(!CLOUD&&!localStorage.getItem(KEY)){localStorage.setItem(KEY,JSON.stringify(db))}toggleLoanMode;render();cloudInit();
